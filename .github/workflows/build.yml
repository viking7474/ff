name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [ windows ]
        arch: [x86_64 ]
        exclude:
          # Fails (.mozbuild does not include clang++-cl)
          - target: windows
            arch: arm64
          # Unsuported
          - target: macos
            arch: i686

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        # Originally from here: https://github.com/AdityaGarg8/remove-unwanted-software/blob/master/action.yml
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL} mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          if [[ (${CODENAME} = focal) || (${CODENAME} = jammy) ]]; then
            sudo apt-get remove -y google-cloud-sdk --fix-missing > /dev/null
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null
          fi
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null

      - uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: "1.23"

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.11"

      - name: Set up LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 clang-18
          if [ "${{ matrix.arch }}" != "x86_64" ]; then
            sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib
          fi
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

      - name: Check disk space
        run: df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools p7zip-full aria2

      - name: Fetch source
        env:
          CAMOUFOX_PASSWD: ${{ secrets.CAMOUFOX_PASSWD }}
        run: |
          make fetch

      - name: Setup and bootstrap
        run: |
          set -e  # Dừng ngay khi có lỗi
      
          # 1️⃣ Xóa folder cũ và tạo folder source mới
          SRC_DIR="$GITHUB_WORKSPACE/camoufox-149.0-beta.1"
          rm -rf "$SRC_DIR"
          mkdir -p "$SRC_DIR"
      
          # 2️⃣ Extract source
          tar -xJf firefox-149.0.source.tar.xz -C "$SRC_DIR" --strip-components=1
      
          # 3️⃣ Tạo các thư mục cần thiết trước khi copy additions
          cd "$SRC_DIR"
          mkdir -p services/settings/dumps/main
          mkdir -p build/vs
          mkdir -p lw
          mkdir -p defaults/pref
      
          # 4️⃣ Copy các file settings và additions
          cp -v ../assets/search-config.json services/settings/dumps/main/search-config.json
          cp -v ../patches/librewolf/pack_vs.py build/vs/
          cp -v ../../settings/camoufox.cfg .
          cp -v ../../settings/distribution/policies.json .
          cp -v ../../settings/defaults/pref/local-settings.js defaults/pref/local-settings.js
          cp -v ../../settings/chrome.css .
          cp -v ../../settings/properties.json .
          touch moz.build
          cp -r ../additions/* .
          cp -v ../scripts/mozfetch.sh lw/
      
          # 5️⃣ Chạy setup-minimal
          make setup-minimal
      
          # 6️⃣ Patch site.py bằng Python -c (đơn giản, tránh EOF và indent phức tạp)
          python3 -c "
          import os
          path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'camoufox-149.0-beta.1/python/mach/mach/site.py')
          if not os.path.exists(path):
              raise FileNotFoundError(f'{path} không tồn tại. Kiểm tra setup-minimal đã chạy đúng chưa.')
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace(
          '        if self._site_packages_source != SitePackagesSource.VENV:\n            pass\n\n        self._virtualenv()',
          '        if self._site_packages_source != SitePackagesSource.VENV:\n            return\n\n        self._virtualenv()'
          )
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('Done patch:', path)
          "
          
          make mozbootstrap
      
          # 8️⃣ Tạo folder dist
          mkdir -p dist

      - name: Create swap space
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build
        run: python3 ./multibuild.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamoufoxBuilds-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
