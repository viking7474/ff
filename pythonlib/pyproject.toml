[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "winfox"
version = "0.5.0"
description = "Winfox Python package with winfox.rdp as the primary automation framework and optional legacy Playwright compatibility"
authors = ["daijro <daijro.dev@gmail.com>"]
license = "MIT"
repository = "https://github.com/daijro/camoufox"
homepage = "https://camoufox.com/python"
readme = "README.md"
keywords = [
    "client",
    "fingerprint",
    "browser",
    "scraping",
    "injector",
    "firefox",
    "rdp",
    "playwright",
]
classifiers = [
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    { include = "camoufox" },
    { include = "winfox" },
]

[tool.poetry.dependencies]
python = "^3.10"
rich-click = "*"
rich = "*"
requests = "*"
orjson = "*"
pyyaml = "*"
platformdirs = "*"
typing_extensions = "*"
geckordp = "*"
websockets = "*"
lxml = "*"
pysocks = "*"
browserforge = {version = "^1.2.4", optional = true}
playwright = {version = "*", optional = true}
numpy = {version = "*", optional = true}
ua_parser = {version = "*", optional = true}
screeninfo = {version = "*", optional = true}
language-tags = {version = "*", optional = true}
inquirer = {version = "*", optional = true}
geoip2 = {version = "*", optional = true}
PySide6 = {version = "*", optional = true}

[tool.poetry.extras]
legacy = [
    "browserforge",
    "playwright",
    "numpy",
    "ua_parser",
    "screeninfo",
    "language-tags",
    "inquirer",
]
geoip = ["geoip2"]
gui = ["PySide6"]

[tool.poetry.scripts]
winfox = "winfox.__main__:cli"
